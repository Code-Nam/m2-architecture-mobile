name: tenpai
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
    sdk: ^3.13.3

dependencies:
    flutter:
        sdk: flutter

    cupertino_icons: ^1.0.8
    freezed_annotation: ^3.1.0
    json_annotation: ^4.12.0
    dio: ^5.11.1
    flutter_riverpod: ^3.4.3
    go_router: ^18.0.1
    material_ui: ^1.3.0
    cupertino_ui: ^1.1.0
    image_picker: ^1.2.3

dev_dependencies:
    flutter_test:
        sdk: flutter

    flutter_lints: ^6.0.0
    build_runner: ^2.16.1
    freezed: ^4.0.1
    json_serializable: ^6.14.1

flutter:
    uses-material-design: true

    # AI-GENERATED (Claude) BEGIN — lesson content assets
    # One JSON per unit under assets/lessons/, read by the lesson asset source.
    assets:
        - assets/lessons/
    # AI-GENERATED (Claude) END — lesson content assets

    # AI-GENERATED (Claude) BEGIN — bundled fonts
    # Why: Project tooling and setup so study time goes to Flutter code.
    # Design handoff: Outfit for everything, IBM Plex Mono for technical
    # labels (numbers, tags, uppercase markers). Bundled as static TTFs so
    # `fontWeight` picks the right file; no google_fonts runtime download.
    fonts:
        - family: Outfit
          fonts:
              - asset: assets/fonts/Outfit-Regular.ttf
                weight: 400
              - asset: assets/fonts/Outfit-Medium.ttf
                weight: 500
              - asset: assets/fonts/Outfit-SemiBold.ttf
                weight: 600
              - asset: assets/fonts/Outfit-Bold.ttf
                weight: 700
        - family: IBM Plex Mono
          fonts:
              - asset: assets/fonts/IBMPlexMono-Regular.ttf
                weight: 400
              - asset: assets/fonts/IBMPlexMono-Medium.ttf
                weight: 500
    # AI-GENERATED (Claude) END
