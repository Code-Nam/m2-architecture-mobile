# AI-GENERATED by Claude (Claude Code), 2026-09-17
# Why: Project tooling and setup so study time goes to Flutter code.
# Tenpai analysis configuration.
#
# Goal: make the naming and privacy conventions in CLAUDE.md cost something to
# break. Lints cannot check "is this symbol used outside its file?" or "does
# this file carry the right suffix?" — those live in tool/check_conventions.dart
# and in the flutter-reviewer agent. Everything a lint *can* check is on.

include: package:flutter_lints/flutter.yaml

# riverpod_lint 3.x is a native analyzer plugin (no custom_lint, no pubspec
# entry). It checks hand-written providers: missing_provider_scope,
# provider_parameters, avoid_public_notifier_properties,
# avoid_ref_inside_state_dispose, async_value_nullable_pattern,
# protected_notifier_properties.
plugins:
  riverpod_lint: ^3.1.9

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Privacy: an unused private symbol is dead code; an undocumented public
    # symbol is either accidentally public or missing its contract.
    unused_element: error
    unused_field: error
    unused_local_variable: error
    public_member_api_docs: error
    # Style that the reviewer should never have to mention.
    always_use_package_imports: error
    require_trailing_commas: error
    directives_ordering: error
    prefer_single_quotes: error

linter:
  rules:
    # --- Naming and privacy pressure -------------------------------------
    - public_member_api_docs
    - type_annotate_public_apis
    - use_late_for_private_fields_and_variables
    - sort_constructors_first
    - avoid_positional_boolean_parameters
    - use_setters_to_change_properties
    - avoid_field_initializers_in_const_classes

    # --- Imports and formatting ------------------------------------------
    - always_use_package_imports
    - directives_ordering
    - require_trailing_commas
    - prefer_single_quotes
    - eol_at_end_of_file
    - flutter_style_todos
    - omit_obvious_local_variable_types

    # --- Correctness habits for a first Flutter project ------------------
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_final_in_for_each
    - avoid_dynamic_calls
    - unawaited_futures
    - avoid_catches_without_on_clauses
    - only_throw_errors
    - cast_nullable_to_non_nullable
    - no_default_cases
    - use_enums
    - unnecessary_lambdas
    - avoid_redundant_argument_values
    - prefer_asserts_with_message
    - use_colored_box
    - use_decorated_box
    - missing_code_block_language_in_doc_comment
    - unnecessary_async
    - unnecessary_ignore
